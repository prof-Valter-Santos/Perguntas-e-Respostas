<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            box-sizing: border-box;
        }

        .card-zoom {
            transform: scale(1.05);
            z-index: 50;
        }

        .overlay {
            backdrop-filter: blur(4px);
        }

        .result-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: bold;
            z-index: 100;
            animation: resultPop 2s ease-out forwards;
            pointer-events: none;
        }

        .correct {
            color: #10b981;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .incorrect {
            color: #ef4444;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        @keyframes resultPop {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                transform: translate(-50%, -50%) scale(1.2) rotate(10deg);
                opacity: 1;
            }

            40% {
                transform: translate(-50%, -50%) scale(0.9) rotate(-5deg);
                opacity: 1;
            }

            60% {
                transform: translate(-50%, -50%) scale(1.1) rotate(3deg);
                opacity: 1;
            }

            80% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(0.8) rotate(0deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-purple-600 via-blue-600 to-indigo-800 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-4">🎯 Quiz Interativo</h1>
            <p class="text-xl text-purple-100">Clique nos cards para responder e pontuar!</p>
        </div>

        <!-- Game Controls -->
        <div class="flex justify-center gap-4 mb-8">
            <button id="finishGame"
                class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-lg font-semibold text-lg shadow-lg transform hover:scale-105 transition-all duration-200">
                🏁 Classificação
            </button>
            <button id="resetGame"
                class="bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-lg font-semibold text-lg shadow-lg transform hover:scale-105 transition-all duration-200">
                🔄 Resetar Quiz
            </button>
        </div>

        <!-- Quiz Cards Grid -->
        <div id="quizGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8">
            <!-- Cards will be generated here -->
        </div>

        <!-- Ranking Modal -->
        <div id="rankingModal"
            class="fixed inset-0 bg-black bg-opacity-50 overlay hidden items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-8 max-w-2xl w-full mx-4 max-h-96 overflow-y-auto">
                <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">🏆 Classificação Final</h2>
                <div id="rankingList" class="space-y-3">
                    <!-- Ranking will be displayed here -->
                </div>
                <button id="closeRanking"
                    class="w-full mt-6 bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-semibold">
                    Fechar
                </button>
            </div>
        </div>

        <!-- Reset Password Modal -->
        <div id="resetModal"
            class="fixed inset-0 bg-black bg-opacity-50 overlay hidden items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4">
                <h3 class="text-2xl font-bold mb-4 text-gray-800 text-center">🔒 Confirmar Reset</h3>
                <p class="text-gray-600 mb-4 text-center">Digite a senha para resetar o quiz:</p>
                <input type="password" id="resetPassword"
                    class="w-full p-3 border-2 border-gray-300 rounded-lg mb-4 text-lg text-center"
                    placeholder="Digite a senha">
                <div class="flex gap-3">
                    <button id="confirmReset"
                        class="flex-1 bg-red-500 hover:bg-red-600 text-white py-3 rounded-lg font-semibold">
                        Confirmar Reset
                    </button>
                    <button id="cancelReset"
                        class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-3 rounded-lg font-semibold">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>

        <!-- Quiz Modal -->
        <div id="quizModal"
            class="fixed inset-0 bg-black bg-opacity-50 overlay hidden items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-8 max-w-lg w-full mx-4">
                <div id="playerSelection" class="block">
                    <h3 class="text-2xl font-bold mb-4 text-gray-800">Escolha o Jogador</h3>
                    <select id="playerSelect" class="w-full p-3 border-2 border-gray-300 rounded-lg mb-4 text-lg">
                        <option value="">Selecione um jogador...</option>
                    </select>
                    <button id="registerPlayer"
                        class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-semibold text-lg">
                        Registrar
                    </button>
                </div>

                <div id="questionSection" class="hidden">
                    <h3 class="text-xl font-bold mb-4 text-gray-800" id="questionText"></h3>
                    <div class="space-y-3 mb-6">
                        <button id="trueBtn"
                            class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-semibold text-lg">
                            ✓ Verdadeiro
                        </button>
                        <button id="falseBtn"
                            class="w-full bg-red-500 hover:bg-red-600 text-white py-3 rounded-lg font-semibold text-lg">
                            ✗ Falso
                        </button>
                    </div>
                </div>

                <button id="closeModal"
                    class="w-full bg-gray-500 hover:bg-gray-600 text-white py-2 rounded-lg font-semibold">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Players list
        const players = [
            "Enzo de Castro Santos", "Gustavo Casagrande Castilho", "Gustavo de Castro Oliveira",
            "Isabela Cisotto Bete", "José Arthur de Camargo", "Julia Sousa Menezes",
            "Kauã Serafim Cinto", "Lucas Augusto Scatolin Faria",
            "Maria Eduarda Gomes de Oliveira", "Mateus Felipe Caldana", "Matheus Eduardo Costa de Andrade", "Matheus Henrique Rozante", "Miguel Silva Caetano",
            "Octavio Tamaoki Ferreira Vaz", "Rafaela Jordana Souza Barros", "Raphael Valeiro de Almeida", "Renan de Oliveira Moretti",
            "Stella da Mota Xavier", "Vinícius Oliveira Pineda"
        ];

        // Quiz questions
        const questions = [
            { question: "PHP é uma linguagem de programação interpretada voltada principalmente para o desenvolvimento web.", answer: true, points: 100 },
            { question: "A tag correta para abrir um código PHP é <?php e fechar com ?>.", answer: true, points: 100 },
            { question: "No PHP, todas as variáveis devem começar com o símbolo $.", answer: true, points: 100 },
            { question: "A função echo e a função print no PHP têm exatamente o mesmo comportamento e desempenho.", answer: false, points: 100 },
            { question: "O PHP é uma linguagem fortemente tipada, ou seja, sempre exige declaração do tipo da variável.", answer: false, points: 100 },
            { question: "Arrays em PHP podem armazenar diferentes tipos de dados ao mesmo tempo.", answer: true, points: 100 },
            { question: "A função count() em PHP é usada para contar os elementos de um array.", answer: true, points: 100 },
            { question: "O superglobal $_POST é usado para capturar dados enviados pelo método GET.", answer: false, points: 100 },
            { question: "O superglobal $_GET é usado para capturar dados enviados pela URL.", answer: true, points: 100 },
            { question: "O PDO no PHP é usado para manipular arquivos do sistema.", answer: false, points: 100 },
            { question: "PDO significa PHP Data Objects.", answer: true, points: 100 },
            { question: "Para iniciar uma sessão em PHP usamos session_start().", answer: true, points: 100 },
            { question: "A diferença entre include e require é que o require gera erro fatal se o arquivo não for encontrado.", answer: true, points: 100 },
            { question: "O comando header('Location: ...') é usado para redirecionar páginas em PHP.", answer: true, points: 100 },
            { question: "A função password_hash() é recomendada para criptografar senhas em PHP.", answer: true, points: 100 },
            { question: "O PHP não possui suporte a tratamento de exceções com try e catch.", answer: false, points: 100 },
            { question: "O operador === no PHP compara valores e tipos.", answer: true, points: 100 },
            { question: "A superglobal $_SESSION pode ser usada para armazenar informações do usuário enquanto ele navega.", answer: true, points: 100 },
            { question: "É possível utilizar PHP embutido dentro de arquivos HTML.", answer: true, points: 100 },
            { question: "O PHP 7 introduziu suporte a tipagem escalar (type hints).", answer: true, points: 100 }
        ];

        // Game state
        let playerScores = {};
        let currentQuestionIndex = 0;
        let selectedPlayer = '';
        let usedQuestions = new Set();
        let questionAnswers = {}; // Store who answered each question and if correct

        // Initialize player scores
        players.forEach(player => {
            playerScores[player] = 0;
        });

        // DOM elements
        const quizGrid = document.getElementById('quizGrid');
        const quizModal = document.getElementById('quizModal');
        const rankingModal = document.getElementById('rankingModal');
        const playerSelect = document.getElementById('playerSelect');
        const playerSelection = document.getElementById('playerSelection');
        const questionSection = document.getElementById('questionSection');
        const questionText = document.getElementById('questionText');

        // Data persistence functions
        function saveGameState() {
            const gameState = {
                playerScores: playerScores,
                usedQuestions: Array.from(usedQuestions),
                questionAnswers: questionAnswers
            };
            localStorage.setItem('quizGameState', JSON.stringify(gameState));
        }

        function loadGameState() {
            const savedState = localStorage.getItem('quizGameState');
            if (savedState) {
                const gameState = JSON.parse(savedState);
                playerScores = gameState.playerScores || {};
                usedQuestions = new Set(gameState.usedQuestions || []);
                questionAnswers = gameState.questionAnswers || {};

                // Initialize missing players
                players.forEach(player => {
                    if (!playerScores[player]) {
                        playerScores[player] = 0;
                    }
                });

                console.log('Estado do jogo carregado:', gameState);
                return true;
            }
            return false;
        }

        function clearGameState() {
            localStorage.removeItem('quizGameState');
            playerScores = {};
            usedQuestions = new Set();
            questionAnswers = {};

            // Initialize player scores
            players.forEach(player => {
                playerScores[player] = 0;
            });
        }

        // Initialize game
        function initGame() {
            // Try to load saved state first
            const hasLoadedState = loadGameState();

            createQuizCards();
            populatePlayerSelect();
            setupEventListeners();

            // If we loaded a saved state, update the cards to show answered questions
            if (hasLoadedState) {
                updateCardsFromSavedState();
            }
        }

        function updateCardsFromSavedState() {
            usedQuestions.forEach(cardIndex => {
                const card = quizGrid.children[cardIndex];
                const answerData = questionAnswers[cardIndex];

                if (card && answerData) {
                    const firstName = answerData.player.split(' ')[0];
                    const isCorrect = answerData.correct;

                    card.innerHTML = `
                        <div class="text-center">
                            <h3 class="text-lg font-bold text-gray-800 mb-2">Pergunta ${cardIndex + 1}</h3>
                            <div class="text-8xl mb-4 ${isCorrect ? 'text-green-500' : 'text-red-500'}">${isCorrect ? '✓' : '✗'}</div>
                            <div class="text-sm ${isCorrect ? 'text-green-600' : 'text-red-600'} font-semibold">
                                ${firstName}
                            </div>
                        </div>
                    `;
                    card.style.cursor = 'default';
                    card.classList.remove('hover:scale-105');
                }
            });
        }

        // Create quiz cards
        function createQuizCards() {
            quizGrid.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-lg p-6 cursor-pointer transform hover:scale-105 transition-all duration-300 hover:shadow-xl';
                card.innerHTML = `
                    <div class="text-center">
                        <div class="text-4xl mb-4">❓</div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">Pergunta ${i + 1}</h3>
                        <p class="text-gray-600">Clique para responder</p>
                        <div class="mt-4 text-sm text-gray-500" id="cardStatus-${i}">Disponível</div>
                    </div>
                `;
                card.addEventListener('click', () => openQuizModal(i));
                quizGrid.appendChild(card);
            }
        }

        // Populate player select
        function populatePlayerSelect() {
            playerSelect.innerHTML = '<option value="">Selecione um jogador...</option>';
            players.forEach(player => {
                const option = document.createElement('option');
                option.value = player;
                option.textContent = player;
                playerSelect.appendChild(option);
            });
        }

        // Open quiz modal
        function openQuizModal(cardIndex) {
            if (usedQuestions.has(cardIndex)) {
                alert('Esta pergunta já foi respondida!');
                return;
            }

            currentQuestionIndex = cardIndex;
            playerSelection.classList.remove('hidden');
            questionSection.classList.add('hidden');
            quizModal.classList.remove('hidden');
            quizModal.classList.add('flex');
        }

        // Setup event listeners
        function setupEventListeners() {
            // Register player button
            document.getElementById('registerPlayer').addEventListener('click', () => {
                selectedPlayer = playerSelect.value;
                if (!selectedPlayer) {
                    alert('Por favor, selecione um jogador!');
                    return;
                }

                playerSelection.classList.add('hidden');
                questionSection.classList.remove('hidden');

                const question = questions[currentQuestionIndex % questions.length];
                questionText.textContent = `${currentQuestionIndex + 1}. ${question.question}`;
            });

            // True/False buttons
            document.getElementById('trueBtn').addEventListener('click', () => answerQuestion(true));
            document.getElementById('falseBtn').addEventListener('click', () => answerQuestion(false));

            // Close modal
            document.getElementById('closeModal').addEventListener('click', closeQuizModal);

            // Finish game
            document.getElementById('finishGame').addEventListener('click', showRanking);

            // Close ranking
            document.getElementById('closeRanking').addEventListener('click', () => {
                rankingModal.classList.add('hidden');
                rankingModal.classList.remove('flex');
            });

            // Reset game button
            document.getElementById('resetGame').addEventListener('click', () => {
                document.getElementById('resetModal').classList.remove('hidden');
                document.getElementById('resetModal').classList.add('flex');
                document.getElementById('resetPassword').focus();
            });

            // Confirm reset
            document.getElementById('confirmReset').addEventListener('click', () => {
                const password = document.getElementById('resetPassword').value;
                if (password === '123456') {
                    clearGameState();
                    document.getElementById('resetModal').classList.add('hidden');
                    document.getElementById('resetModal').classList.remove('flex');
                    document.getElementById('resetPassword').value = '';

                    // Recreate the cards to reset visual state
                    createQuizCards();

                    alert('🔄 Quiz resetado com sucesso!');
                } else {
                    alert('❌ Senha incorreta!');
                    document.getElementById('resetPassword').value = '';
                    document.getElementById('resetPassword').focus();
                }
            });

            // Cancel reset
            document.getElementById('cancelReset').addEventListener('click', () => {
                document.getElementById('resetModal').classList.add('hidden');
                document.getElementById('resetModal').classList.remove('flex');
                document.getElementById('resetPassword').value = '';
            });

            // Allow Enter key to confirm reset
            document.getElementById('resetPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('confirmReset').click();
                }
            });
        }

        // Show result animation
        function showResultAnimation(isCorrect) {
            const animation = document.createElement('div');
            animation.className = `result-animation ${isCorrect ? 'correct' : 'incorrect'}`;
            animation.textContent = isCorrect ? '✓' : '✗';
            document.body.appendChild(animation);

            setTimeout(() => {
                document.body.removeChild(animation);
            }, 2000);
        }

//CODIGO GPT

function answerQuestion(userAnswer) {
    const question = questions[currentQuestionIndex % questions.length];
    const isCorrect = userAnswer === question.answer;

    // garante que existe um jogador selecionado
    if (!selectedPlayer) {
        alert('Por favor selecione um jogador antes de responder!');
        return;
    }

    // atualiza pontuação (garantindo valor inicial)
    playerScores[selectedPlayer] = (playerScores[selectedPlayer] || 0) + (isCorrect ? (question.points || 0) : 0);

    // marca pergunta usada e armazena quem respondeu e se acertou
    usedQuestions.add(currentQuestionIndex);
    questionAnswers[currentQuestionIndex] = {
        player: selectedPlayer,
        correct: isCorrect
    };

    // animação de resultado (visível)
    showResultAnimation(isCorrect);

    // --- Atualiza o card IMEDIATAMENTE antes de resetar o modal ---
    const cardIndex = currentQuestionIndex;
    const card = quizGrid.children[cardIndex];
    const firstName = (selectedPlayer.split && selectedPlayer.split(' ')[0]) || selectedPlayer;

    if (card) {
        // cria um clone do card para remover listeners antigos
        const newCard = card.cloneNode(true);

        newCard.innerHTML = `
            <div class="text-center">
                <h3 class="text-lg font-bold text-gray-800 mb-2">Pergunta ${cardIndex + 1}</h3>
                <div class="text-8xl mb-4 ${isCorrect ? 'text-green-500' : 'text-red-500'}">${isCorrect ? '✓' : '✗'}</div>
                <div class="text-sm ${isCorrect ? 'text-green-600' : 'text-red-600'} font-semibold">
                    ${firstName}
                </div>
            </div>
        `;

        // deixa claro visualmente que não é clicável e remove hover
        newCard.style.cursor = 'default';
        newCard.classList.remove('hover:scale-105', 'hover:shadow-xl');
        newCard.style.pointerEvents = 'none'; // evita novos cliques

        quizGrid.replaceChild(newCard, card);
    }

    // salva o estado atualizado
    saveGameState();

    // --- Fecha o modal e reinicia a tela para o estado inicial (selecionar jogador) ---
    quizModal.classList.add('hidden');
    quizModal.classList.remove('flex');

    // reset dos controles do modal para que, ao abrir outra pergunta, volte ao começo (seleção do jogador)
    playerSelect.value = '';
    selectedPlayer = '';
    playerSelection.classList.remove('hidden');
    questionSection.classList.add('hidden');
}



        // Close quiz modal
        function closeQuizModal() {
            quizModal.classList.add('hidden');
            quizModal.classList.remove('flex');
            playerSelect.value = '';
            selectedPlayer = '';
        }

        // Show ranking
        function showRanking() {
            console.log('Pontuações atuais:', playerScores); // Debug

            const sortedPlayers = Object.entries(playerScores)
                .sort(([, a], [, b]) => b - a);

            const rankingList = document.getElementById('rankingList');
            rankingList.innerHTML = '';

            // Filter players with points for podium positions
            const playersWithPoints = sortedPlayers.filter(([, score]) => score > 0);

            console.log('Jogadores com pontos:', playersWithPoints); // Debug

            if (playersWithPoints.length === 0) {
                rankingList.innerHTML = '<p class="text-center text-gray-600 text-lg">🎮 Nenhum jogador pontuou ainda!</p><p class="text-center text-gray-500 mt-2">Responda algumas perguntas para ver o ranking aqui.</p>';
            } else {
                playersWithPoints.forEach(([player, score], index) => {
                    const position = index + 1;
                    let medal = '';
                    let bgColor = 'bg-gray-50';

                    if (position === 1) {
                        medal = '🥇';
                        bgColor = 'bg-yellow-50 border-2 border-yellow-200';
                    } else if (position === 2) {
                        medal = '🥈';
                        bgColor = 'bg-gray-100 border-2 border-gray-300';
                    } else if (position === 3) {
                        medal = '🥉';
                        bgColor = 'bg-orange-50 border-2 border-orange-200';
                    } else {
                        medal = `${position}º`;
                    }

                    const rankItem = document.createElement('div');
                    rankItem.className = `flex justify-between items-center ${bgColor} p-4 rounded-lg mb-2`;
                    rankItem.innerHTML = `
                        <div class="flex items-center">
                            <span class="text-2xl mr-3 min-w-[3rem] text-center">${medal}</span>
                            <span class="font-semibold text-gray-800">${player}</span>
                        </div>
                        <span class="text-xl font-bold text-blue-600">${score} pts</span>
                    `;
                    rankingList.appendChild(rankItem);
                });
            }

            rankingModal.classList.remove('hidden');
            rankingModal.classList.add('flex');
        }

        // Initialize the game
        initGame();
    </script>
